<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>atm_sell_pressure — Cumulative P&amp;L</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e6e6e6;
    --train: #2563eb;
    --test: #e8720c;
    --forward: #0f7a4d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --panel: #1c1f23;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #2b2f34;
      --train: #5b9bff;
      --test: #ff9c4a;
      --forward: #35c98a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --panel: #1c1f23;
    --text: #eaeaea;
    --muted: #9a9a9a;
    --border: #2b2f34;
    --train: #5b9bff;
    --test: #ff9c4a;
    --forward: #35c98a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 18px;
    font-weight: 650;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .legend-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 4px 4px;
    overflow-x: auto;
  }
  #chart {
    width: 100%;
    min-width: 320px;
    height: 460px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat .value { font-size: 16px; font-weight: 650; margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>atm_sell_pressure — Cumulative P&amp;L</h1>
    <p class="subtitle">NIFTY 0DTE, weekly resolution, 2024-02-08 → 2026-07-21</p>

    <div class="legend-row">
      <span class="legend-item"><span class="dot" style="background:var(--train)"></span>Train</span>
      <span class="legend-item"><span class="dot" style="background:var(--test)"></span>Test</span>
      <span class="legend-item"><span class="dot" style="background:var(--forward)"></span>Forward (2026)</span>
    </div>

    <div class="chart-card">
      <div id="chart"></div>
    </div>

    <div class="stats" id="stats"></div>
  </div>

<script>

const series = { train: {x:[],y:[]}, test: {x:[],y:[]}, forward: {x:[],y:[]} };
rows.forEach(([d, p, v]) => { series[p].x.push(d); series[p].y.push(v); });

const rootStyles = getComputedStyle(document.documentElement);
const colorTrain = rootStyles.getPropertyValue('--train').trim();
const colorTest = rootStyles.getPropertyValue('--test').trim();
const colorForward = rootStyles.getPropertyValue('--forward').trim();
const textColor = rootStyles.getPropertyValue('--text').trim();
const mutedColor = rootStyles.getPropertyValue('--muted').trim();
const borderColor = rootStyles.getPropertyValue('--border').trim();

function fmtINR(v) {
  const sign = v < 0 ? "-" : "+";
  const abs = Math.abs(v);
  return sign + "₹" + abs.toLocaleString("en-IN", {maximumFractionDigits: 0});
}

function makeTrace(name, color, data) {
  const lastX = data.x[data.x.length - 1];
  const lastY = data.y[data.y.length - 1];
  return {
    x: data.x,
    y: data.y,
    name: name,
    mode: "lines",
    line: { shape: "hv", width: 2, color: color },
    hovertemplate: "%{x}<br>" + name + ": %{y:,.0f}<extra></extra>",
    showlegend: false,
    _lastX: lastX,
    _lastY: lastY
  };
}

const tTrain = makeTrace("Train", colorTrain, series.train);
const tTest = makeTrace("Test", colorTest, series.test);
const tForward = makeTrace("Forward", colorForward, series.forward);

const annotations = [tTrain, tTest, tForward].map(t => ({
  x: t._lastX,
  y: t._lastY,
  xref: "x",
  yref: "y",
  text: fmtINR(t._lastY),
  showarrow: false,
  xanchor: "left",
  font: { size: 12, color: t.line.color },
  xshift: 6
}));

const layout = {
  paper_bgcolor: "rgba(0,0,0,0)",
  plot_bgcolor: "rgba(0,0,0,0)",
  margin: { l: 60, r: 90, t: 10, b: 40 },
  font: { color: textColor, size: 12 },
  xaxis: {
    type: "date",
    gridcolor: borderColor,
    showline: false,
    tickfont: { color: mutedColor }
  },
  yaxis: {
    title: { text: "Cumulative P&L (₹)" },
    gridcolor: borderColor,
    zeroline: false,
    tickfont: { color: mutedColor },
    tickformat: ",.0f"
  },
  hovermode: "x unified",
  annotations: annotations
};

Plotly.newPlot("chart", [tTrain, tTest, tForward], layout, {
  responsive: true,
  displaylogo: false,
  modeBarButtonsToRemove: ["lasso2d", "select2d"]
});

// ---- summary stats ----
function last(arr) { return arr[arr.length - 1]; }
const statsEl = document.getElementById("stats");
const statDefs = [
  { label: "Train final", value: fmtINR(last(series.train.y)) },
  { label: "Test final", value: fmtINR(last(series.test.y)) },
  { label: "Forward final (2026)", value: fmtINR(last(series.forward.y)) },
  { label: "Total sessions", value: rows.length }
];
statsEl.innerHTML = statDefs.map(s =>
  `<div class="stat"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`
).join("");
</script>
</body>
</html>
